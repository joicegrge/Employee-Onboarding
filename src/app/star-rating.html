<div class="star-rating" role="group" aria-label="Skill rating from 1 to 5 stars" (focusout)="onFocusOut($event)">
  @for (star of stars; track star) {
    <button
      type="button"
      class="star-button"
      [class.selected]="star <= value()"
      [attr.aria-pressed]="star === value()"
      [attr.aria-label]="star + ' out of 5 stars'"
      (click)="setRating(star)"
    >
      <span aria-hidden="true">{{ star <= value() ? '★' : '☆' }}</span>
    </button>
  }
</div>
